<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mondes Perdus - Duels</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, #4b3725 0, #1c130c 45%, #090604 100%);
      color: #f5e6c8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 680px;
      border: 3px solid #c9a45b;
      border-radius: 18px;
      background: rgba(20, 12, 6, 0.94);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      padding: 22px;
      margin-top: 20px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #ffd98a;
      font-size: 2rem;
    }

    h2 {
      color: #e7c172;
      font-size: 1.2rem;
      border-bottom: 1px solid #8d6b36;
      padding-bottom: 6px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #c9a45b;
      font-size: 1rem;
    }

    select,
    input {
      background: #f8ecd0;
      color: #1e1309;
    }

    button {
      margin-top: 18px;
      background: linear-gradient(#d8aa55, #9b6827);
      color: #120b05;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.1);
    }

    .panel {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #8d6b36;
      border-radius: 12px;
      background: rgba(255, 244, 210, 0.08);
    }

    .small {
      font-size: 0.9rem;
      opacity: 0.85;
      text-align: center;
    }

    .error {
      color: #ffb3a7;
      font-weight: bold;
    }

    .pg-number {
      font-size: 2.5rem;
      text-align: center;
      color: #ffd98a;
      margin: 10px 0;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      text-align: center;
    }

    .stat-grid.two {
      grid-template-columns: 1fr 1fr;
    }

    .stat {
      border: 1px solid #8d6b36;
      border-radius: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
    }

    .stat strong {
      display: block;
      color: #ffd98a;
      font-size: 1.2rem;
    }

    .danger {
      color: #ffb3a7;
      font-weight: bold;
    }

    .success {
      color: #b8ffbd;
      font-weight: bold;
    }

    .page-image-box {
      margin: 14px 0;
      padding: 8px;
      border: 1px solid #c9a45b;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.25);
    }
    
    .page-image {
      display: block;
      width: 100%;
      border-radius: 10px;
    }

    body.duel-active {
      padding: 6px;
    }
    
    body.duel-active .app {
      margin-top: 0;
      padding: 10px;
      border-radius: 12px;
    }
    
    body.duel-active #setupPanel,
    body.duel-active #appSubtitle {
      display: none;
    }
    
    body.duel-active h1 {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }
    
    body.duel-active h2 {
      font-size: 1rem;
      margin: 4px 0 6px;
      padding-bottom: 4px;
    }
    
    body.duel-active .panel {
      margin-top: 8px;
      padding: 8px;
      border-radius: 10px;
    }
    
    body.duel-active label {
      margin-top: 8px;
      margin-bottom: 3px;
    }
    
    body.duel-active select,
    body.duel-active input,
    body.duel-active button {
      padding: 8px;
      font-size: 0.95rem;
    }
    
    body.duel-active .stat {
      padding: 6px;
    }
    
    body.duel-active .stat strong {
      font-size: 1rem;
    }
    
    body.duel-active .pg-number {
      font-size: 1.7rem;
      margin: 4px 0;
    }
    
    body.duel-active p {
      margin: 5px 0;
    }
    
    body.duel-active .page-image-box {
      margin: 6px 0;
      padding: 4px;
    }
    
    body.duel-active .page-image {
      max-height: 38vh;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1 id="appTitle">Mondes Perdus</h1>
    <p id="appSubtitle" class="small">Prototype familial de duel numérique</p>
    
    <section id="setupPanel">
      <h2>Début de duel</h2>

      <label for="playerSheet">Ma fiche personnage</label>
      <select id="playerSheet">
        <option value="chevalier">Chevalier</option>
        <option value="squelette">Squelette</option>
      </select>

      <label for="opponentBook">Livret affiché, adversaire</label>
      <select id="opponentBook">
        <option value="chevalier">Chevalier</option>
        <option value="squelette">Squelette</option>
      </select>

      <button onclick="startDuel()">Commencer le duel</button>

      <p id="loadMessage" class="small"></p>
    </section>

    <section id="duelPanel" class="panel" style="display:none;">
      <h2>Duel en cours</h2>

      <p><strong>Ma fiche :</strong> <span id="currentSheet"></span></p>
      <p><strong>Livret affiché :</strong> <span id="currentBook"></span></p>

      <div class="stat-grid">
        <div class="stat">
          Taille
          <strong id="statSize">-</strong>
        </div>
        <div class="stat">
          Corps départ
          <strong id="statBody">-</strong>
        </div>
        <div class="stat">
          Attaques
          <strong id="statAttacks">-</strong>
        </div>
      </div>

      <div class="panel">
        <h2>Points de Corps</h2>

        <div class="stat-grid two">
          <div class="stat">
            Moi
            <strong id="myBodyDisplay">-</strong>
          </div>
          <div class="stat">
            Adversaire
            <strong id="opponentBodyDisplay">-</strong>
          </div>
        </div>

        <label for="myBodyManual">Corriger mes Points de Corps</label>
        <input id="myBodyManual" type="number" placeholder="Exemple : 9" />
        <button onclick="adjustMyBody()">Mettre à jour mes Points de Corps</button>

        <p id="bodyStatus" class="small"></p>
      </div>

      <div class="panel">
        <h2>Tour actuel</h2>
      
        <label for="distanceMode">Situation du tour</label>
        <select id="distanceMode" onchange="refreshActionList()">
          <option value="normal">Combat rapproché</option>
          <option value="distance">Distance Accrue</option>
        </select>
      
        <label for="restrictionMode">Restriction reçue de l’adversaire</label>
        <select id="restrictionMode" onchange="refreshActionList()">
          <option value="none">Aucune restriction</option>
          <option value="no_blue">Pas de Bleu</option>
          <option value="no_red">Pas de Rouge</option>
          <option value="no_orange">Pas d’Orange</option>
          <option value="no_red_orange">Pas de Rouge ni d’Orange</option>
          <option value="no_blue_yellow">Pas de Bleu ni de Jaune</option>
          <option value="no_thrust">Pas d’Estoc</option>
          <option value="no_lateral">Pas de Coup Latéral</option>
          <option value="only_green">Seulement Vert</option>
          <option value="only_yellow">Seulement Jaune</option>
          <option value="only_green_yellow">Seulement Vert ou Jaune</option>
          <option value="only_brown">Seulement Marron</option>
          <option value="only_bond">Seulement Bond</option>
          <option value="disarmed">Désarmé</option>
        </select>
      
        <label for="actionChoice">Action choisie</label>
        <select id="actionChoice"></select>
      
        <button onclick="chooseAction()">Choisir cette action</button>
      </div>

      <div id="pgPanel" class="panel" style="display:none;">
        <p><strong>PG à annoncer à l’adversaire :</strong></p>
        <p id="pgToAnnounce" class="pg-number"></p>

        <label for="enemyPg">PG reçu de l’adversaire</label>
        <input id="enemyPg" type="number" placeholder="Exemple : 42" />

        <button onclick="resolveTurn()">Afficher la page résultat</button>
      </div>

      <div id="resultPanel" class="panel" style="display:none;">
        <h2>Résultat</h2>
        <div id="resultText"></div>
      
        <button id="nextTurnButton" onclick="nextTurn()" style="display:none;">
          Passer au tour suivant
        </button>
      </div>
    </section>
  </main>

  <script>
    let catalog = null;
    let currentFighter = null;
    let currentOpponentFighter = null;
    let currentBook = null;
    let currentActions = [];
    let selectedAction = null;

    let sizeModifier = 0;

    let myMaxBody = 0;
    let myCurrentBody = 0;
    let opponentMaxBody = 0;
    let opponentCurrentBody = 0;

    let lastDamage = null;
    let damageAlreadyApplied = false;

    async function loadJson(path) {
      const response = await fetch(path + "?v=" + Date.now());
      if (!response.ok) {
        throw new Error("Impossible de charger : " + path);
      }
      return await response.json();
    }

    function fighterLabel(fighter) {
      return fighter.shortName || fighter.fullName || fighter.id;
    }

    function fillSelect(selectId, fighters) {
      const select = document.getElementById(selectId);
      select.innerHTML = "";

      fighters.forEach(fighter => {
        const option = document.createElement("option");
        option.value = fighter.id;
        option.textContent = fighterLabel(fighter);
        select.appendChild(option);
      });
    }

    async function initApp() {
      const message = document.getElementById("loadMessage");

      try {
        catalog = await loadJson("data/catalog.json");

        fillSelect("playerSheet", catalog.fighters);
        fillSelect("opponentBook", catalog.fighters);

        message.textContent = "Catalogue chargé : " + catalog.fighters.length + " combattants disponibles.";
      } catch (error) {
        message.innerHTML = '<span class="error">' + error.message + '</span>';
      }
    }

    function findCatalogEntry(id) {
      return catalog.fighters.find(fighter => fighter.id === id);
    }

    function updateBodyDisplays() {
      document.getElementById("myBodyDisplay").textContent = myCurrentBody + " / " + myMaxBody;
      document.getElementById("opponentBodyDisplay").textContent = opponentCurrentBody + " / " + opponentMaxBody;

      const status = document.getElementById("bodyStatus");

      if (opponentCurrentBody <= -5) {
        status.innerHTML = '<span class="danger">Adversaire à -5 ou moins : mort selon les règles.</span>';
      } else if (opponentCurrentBody < 1) {
        status.innerHTML = '<span class="success">Adversaire sous 1 Point de Corps : combat terminé.</span>';
      } else if (myCurrentBody <= -5) {
        status.innerHTML = '<span class="danger">Tu es à -5 ou moins : mort selon les règles.</span>';
      } else if (myCurrentBody < 1) {
        status.innerHTML = '<span class="danger">Tu es sous 1 Point de Corps : hors combat.</span>';
      } else {
        status.textContent = "";
      }
    }

    function adjustMyBody() {
      const value = document.getElementById("myBodyManual").value;

      if (value === "") {
        alert("Entre ton nouveau total de Points de Corps.");
        return;
      }

      myCurrentBody = Number(value);
      document.getElementById("myBodyManual").value = "";
      updateBodyDisplays();
    }

    function actionLabel(action) {
      if (action.category) {
        return action.category + " " + action.name;
      }
    
      return action.name;
    }
    
    function actionAllowedByRestriction(action, restriction) {
      const color = action.color;
      const category = action.category || "";
      const name = action.name || "";
    
      if (!action.available) return false;
    
      switch (restriction) {
        case "none":
          return true;
    
        case "no_blue":
          return color !== "bleu";
    
        case "no_red":
          return color !== "rouge";
    
        case "no_orange":
          return color !== "orange";
    
        case "no_red_orange":
          return color !== "rouge" && color !== "orange";
    
        case "no_blue_yellow":
          return color !== "bleu" && color !== "jaune";
    
        case "no_thrust":
          return category !== "Estoc" && !name.toLowerCase().includes("estoc");
    
        case "no_lateral":
          return category !== "Coup latéral" && !name.toLowerCase().includes("latéral");
    
        case "only_green":
          return color === "vert";
    
        case "only_yellow":
          return color === "jaune";
    
        case "only_green_yellow":
          return color === "vert" || color === "jaune";
    
        case "only_brown":
          return color === "marron";
    
        case "only_bond":
          return category === "Bond" || name.toLowerCase().includes("bond");
    
        case "disarmed":
          return (
            name.toLowerCase().includes("coup de pied") ||
            color === "jaune" ||
            color === "vert"
          ) && !name.toLowerCase().includes("coup latéral féroce");
    
        default:
          return true;
      }
    }
    
    function getActionsForCurrentMode() {
      const distanceMode = document.getElementById("distanceMode").value;
    
      if (distanceMode === "distance") {
        return currentFighter.distanceActions || [];
      }
    
      return currentFighter.actions || [];
    }
    
    function refreshActionList() {
      if (!currentFighter) return;
    
      const actions = getActionsForCurrentMode();
      const restriction = document.getElementById("restrictionMode").value;
    
      fillActions(actions, restriction);
    }
    
    function fillActions(actions, restriction = "none") {
      const select = document.getElementById("actionChoice");
      select.innerHTML = "";
      currentActions = [];
    
      actions.forEach(action => {
        if (!actionAllowedByRestriction(action, restriction)) return;
    
        currentActions.push(action);
    
        const option = document.createElement("option");
        option.value = action.id;
        option.textContent =
          actionLabel(action) +
          " — PG " + action.pg +
          " / MOD " + action.mod +
          " / " + action.color;
        select.appendChild(option);
      });
    
      if (currentActions.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "Aucune action disponible avec cette restriction";
        select.appendChild(option);
      }
    }

    async function startDuel() {
      const sheetId = document.getElementById("playerSheet").value;
      const bookId = document.getElementById("opponentBook").value;

      const sheetEntry = findCatalogEntry(sheetId);
      const bookEntry = findCatalogEntry(bookId);

      document.getElementById("pgPanel").style.display = "none";
      document.getElementById("resultPanel").style.display = "none";

      try {
        currentFighter = await loadJson(sheetEntry.sheetFile);
        currentOpponentFighter = await loadJson(bookEntry.sheetFile);
        currentBook = await loadJson(bookEntry.bookFile);

        sizeModifier = currentFighter.size - currentOpponentFighter.size;

        myMaxBody = Number(currentFighter.bodyPointsStart);
        myCurrentBody = myMaxBody;

        opponentMaxBody = Number(currentOpponentFighter.bodyPointsStart);
        opponentCurrentBody = opponentMaxBody;

        document.getElementById("currentSheet").textContent = sheetEntry.fullName;
        document.getElementById("currentBook").textContent = bookEntry.fullName;

        document.getElementById("statSize").textContent = currentFighter.size;
        document.getElementById("statBody").textContent = currentFighter.bodyPointsStart;
        document.getElementById("statAttacks").textContent = currentFighter.attacks;

        updateBodyDisplays();
        document.getElementById("distanceMode").value = "distance";
        document.getElementById("restrictionMode").value = "none";
        refreshActionList();
        document.getElementById("duelPanel").style.display = "block";
        document.body.classList.add("duel-active");
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (error) {
        alert(
          "Erreur : " + error.message +
          "\n\nPour l’instant, seul le livret Chevalier existe. Choisis donc Chevalier comme livret affiché pour tester."
        );
      }
    }

    function chooseAction() {
      const actionId = document.getElementById("actionChoice").value;
      selectedAction = currentActions.find(action => action.id === actionId);

      if (!selectedAction) {
        alert("Choisis une action.");
        return;
      }

      lastDamage = null;
      damageAlreadyApplied = false;

      document.getElementById("enemyPg").value = "";
      document.getElementById("pgToAnnounce").textContent = selectedAction.pg;
      document.getElementById("pgPanel").style.display = "block";
      document.getElementById("resultPanel").style.display = "none";
    }

    function calculateDamage(page, action) {
      if (page.score === null || page.score === undefined) {
        return null;
      }

      const score = Number(page.score);
      const mod = Number(action.mod || 0);
      const bonus = Number(action.bonus || 0);

      let total = score + mod + bonus;

      if (action.color === "orange" || action.color === "rouge") {
        total += sizeModifier;
      }

      return Math.max(0, total);
    }

    function resolveTurn() {
      const enemyPg = document.getElementById("enemyPg").value;
      const bookEntry = findCatalogEntry(document.getElementById("opponentBook").value);

      if (!selectedAction) {
        alert("Choisis d’abord une action.");
        return;
      }

      if (!enemyPg) {
        alert("Entre le PG donné par ton adversaire.");
        return;
      }

      if (!currentBook) {
        alert("Aucun livret chargé.");
        return;
      }

      const myMovementPage = String(selectedAction.pg);
      const enemyMovementPage = String(enemyPg);

      const movementTable = currentBook.movementPages[myMovementPage];

      if (!movementTable) {
        alert("Aucune table de mouvement trouvée pour ton PG : " + myMovementPage);
        return;
      }

      const resultPageNumber = movementTable[enemyMovementPage];

      if (resultPageNumber === undefined || resultPageNumber === null) {
        alert(
          "Aucun résultat trouvé pour :\n" +
          "Ton PG : " + myMovementPage + "\n" +
          "PG reçu : " + enemyMovementPage
        );
        return;
      }

      const page = currentBook.pages[String(resultPageNumber)];

      if (!page) {
        alert("La page résultat " + resultPageNumber + " existe dans la table, mais pas dans la liste des pages.");
        return;
      }

      const damage = calculateDamage(page, selectedAction);
      lastDamage = damage;
      damageAlreadyApplied = false;

      let scoreText = "";

      if (page.score === null || page.score === undefined) {
        scoreText = "<p>Aucun SCORE sur cette page.</p>";
      } else {
        scoreText =
          "<p>" +
          "SCORE de la page : <strong>" + page.score + "</strong><br>" +
          "MOD de ton action : <strong>" + selectedAction.mod + "</strong><br>" +
          "Bonus d’évolution : <strong>" + (selectedAction.bonus || 0) + "</strong><br>";

        if (selectedAction.color === "orange" || selectedAction.color === "rouge") {
          scoreText += "Modificateur de Taille : <strong>" + sizeModifier + "</strong><br>";
        }

        scoreText += "Dégâts à infliger : <strong>" + damage + "</strong></p>";
      }
      let imageHtml = "";

      const imagePath =
        page.image ||
        "images/" + currentBook.id + "/LW_" + currentBook.id + "_" + resultPageNumber + ".png";
      
      imageHtml =
        '<div class="page-image-box">' +
        '<img class="page-image" src="' + imagePath + '?v=' + Date.now() + '" alt="Page ' + resultPageNumber + '" onerror="this.parentElement.style.display=\'none\'">' +
        '</div>';
      
      let applyButton = "";

      if (damage !== null) {
        applyButton =
          '<button onclick="applyDamageToOpponent()">Appliquer les dégâts à l’adversaire</button>' +
          '<p id="applyStatus" class="small"></p>';
      }

      document.getElementById("resultText").innerHTML =
        "<p><strong>Livret utilisé :</strong> " + bookEntry.shortName + "<br>" +
        "<strong>Ton action :</strong> " + actionLabel(selectedAction) + "<br>" +
        "<strong>Ton PG :</strong> " + selectedAction.pg + "<br>" +
        "<strong>PG reçu :</strong> " + enemyPg + "</p>" +

       "<p><strong>Page résultat :</strong> " + resultPageNumber + "<br>" +
       "<strong>" + page.title + "</strong></p>" +
        
        imageHtml +
        
        scoreText +

        "<p><strong>Instruction à lire à l’adversaire :</strong><br>" +
        page.instruction + "</p>" +

        applyButton;

      document.getElementById("resultPanel").style.display = "block";
      document.getElementById("nextTurnButton").style.display = "block";
    }

    function applyDamageToOpponent() {
      const status = document.getElementById("applyStatus");

      if (lastDamage === null || lastDamage === undefined) {
        status.innerHTML = '<span class="danger">Aucun dégât à appliquer.</span>';
        return;
      }

      if (damageAlreadyApplied) {
        status.innerHTML = '<span class="danger">Ces dégâts ont déjà été appliqués.</span>';
        return;
      }

      opponentCurrentBody -= Number(lastDamage);
      damageAlreadyApplied = true;

      updateBodyDisplays();

      if (lastDamage === 0) {
        status.innerHTML = '<span class="success">Aucun dégât. Points de Corps adverses inchangés.</span>';
      } else {
        status.innerHTML =
          '<span class="success">' +
          lastDamage +
          ' dégât(s) appliqué(s) à l’adversaire.</span>';
      }
    }

    function nextTurn() {
      selectedAction = null;
      lastDamage = null;
      damageAlreadyApplied = false;
    
      document.getElementById("enemyPg").value = "";
      document.getElementById("pgPanel").style.display = "none";
      document.getElementById("resultPanel").style.display = "none";
      document.getElementById("resultText").innerHTML = "";
      document.getElementById("nextTurnButton").style.display = "none";
    
      document.getElementById("bodyStatus").textContent = "";

      refreshActionList();
      window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }
    initApp();
  </script>
</body>
</html>
