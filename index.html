<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mondes Perdus - Duels</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, #4b3725 0, #1c130c 45%, #090604 100%);
      color: #f5e6c8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      border: 3px solid #c9a45b;
      border-radius: 18px;
      background: rgba(20, 12, 6, 0.92);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      padding: 22px;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #ffd98a;
      font-size: 2rem;
    }

    h2 {
      color: #e7c172;
      font-size: 1.2rem;
      border-bottom: 1px solid #8d6b36;
      padding-bottom: 6px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #c9a45b;
      font-size: 1rem;
    }

    select,
    input {
      background: #f8ecd0;
      color: #1e1309;
    }

    button {
      margin-top: 18px;
      background: linear-gradient(#d8aa55, #9b6827);
      color: #120b05;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.1);
    }

    .panel {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #8d6b36;
      border-radius: 12px;
      background: rgba(255, 244, 210, 0.08);
    }

    .small {
      font-size: 0.9rem;
      opacity: 0.85;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Mondes Perdus</h1>
    <p class="small">Prototype familial de duel numérique</p>

    <section>
      <h2>Début de duel</h2>

      <label for="playerSheet">Ma fiche personnage</label>
      <select id="playerSheet">
        <option value="chevalier">Chevalier</option>
        <option value="squelette">Squelette</option>
      </select>

      <label for="opponentBook">Livret affiché, adversaire</label>
      <select id="opponentBook">
        <option value="chevalier">Chevalier</option>
        <option value="squelette">Squelette</option>
      </select>

      <button onclick="startDuel()">Commencer le duel</button>
    </section>

    <section id="duelPanel" class="panel" style="display:none;">
      <h2>Duel en cours</h2>

      <p><strong>Ma fiche :</strong> <span id="currentSheet"></span></p>
      <p><strong>Livret affiché :</strong> <span id="currentBook"></span></p>

      <label for="actionChoice">Action choisie</label>
      <select id="actionChoice">
        <option value="50">Distance accrue : Charge</option>
        <option value="52">Distance accrue : Attente</option>
        <option value="54">Distance accrue : Esquive</option>
      </select>

      <button onclick="chooseAction()">Choisir cette action</button>

      <div id="pgPanel" class="panel" style="display:none;">
        <p><strong>PG à annoncer à l’adversaire :</strong></p>
        <p id="pgToAnnounce" style="font-size:2rem; text-align:center; color:#ffd98a;"></p>

        <label for="enemyPg">PG reçu de l’adversaire</label>
        <input id="enemyPg" type="number" placeholder="Exemple : 42" />

        <button onclick="resolveTurn()">Afficher la page résultat</button>
      </div>

      <div id="resultPanel" class="panel" style="display:none;">
        <h2>Résultat</h2>
        <p id="resultText"></p>
      </div>
    </section>
  </main>

  <script>
    function labelFromId(id) {
      if (id === "chevalier") return "Chevalier";
      if (id === "squelette") return "Squelette";
      return id;
    }

    function startDuel() {
      const sheet = document.getElementById("playerSheet").value;
      const book = document.getElementById("opponentBook").value;

      document.getElementById("currentSheet").textContent = labelFromId(sheet);
      document.getElementById("currentBook").textContent = labelFromId(book);

      document.getElementById("duelPanel").style.display = "block";
      document.getElementById("pgPanel").style.display = "none";
      document.getElementById("resultPanel").style.display = "none";
    }

    function chooseAction() {
      const actionPg = document.getElementById("actionChoice").value;

      document.getElementById("pgToAnnounce").textContent = actionPg;
      document.getElementById("pgPanel").style.display = "block";
      document.getElementById("resultPanel").style.display = "none";
    }

    function resolveTurn() {
      const myPg = document.getElementById("actionChoice").value;
      const enemyPg = document.getElementById("enemyPg").value;
      const book = document.getElementById("opponentBook").value;

      if (!enemyPg) {
        alert("Entre le PG donné par ton adversaire.");
        return;
      }

      document.getElementById("resultText").innerHTML =
        "Tu as choisi le PG <strong>" + myPg + "</strong>.<br>" +
        "Ton adversaire t’a donné le PG <strong>" + enemyPg + "</strong>.<br><br>" +
        "Dans la prochaine étape, l’application croisera ces données dans le livret <strong>" +
        labelFromId(book) +
        "</strong> pour afficher automatiquement la bonne page.";

      document.getElementById("resultPanel").style.display = "block";
    }
  </script>
</body>
</html>
