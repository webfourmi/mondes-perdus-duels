<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mondes Perdus - Arène de Combat</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, #4b3725 0, #1c130c 45%, #090604 100%);
      color: #f5e6c8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      box-sizing: border-box;
    }

    .splash {
      width: 100%;
      max-width: 760px;
      padding: 24px;
      border: 3px solid #c9a45b;
      border-radius: 24px;
      background:
        radial-gradient(circle at top, rgba(255, 217, 138, 0.16), transparent 55%),
        rgba(20, 12, 6, 0.96);
      box-shadow: 0 0 36px rgba(0, 0, 0, 0.85);
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 14px;
      border: 1px solid #c9a45b;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.25);
      color: #ffe7a6;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #ffd98a;
      font-size: 3rem;
      text-shadow: 0 0 14px rgba(255, 217, 138, 0.35);
    }

    h2 {
      margin: 8px 0 14px;
      color: #f3d7a0;
      font-size: 1.35rem;
      font-weight: normal;
    }

    p {
      max-width: 520px;
      margin: 0 auto 18px;
      line-height: 1.45;
      font-size: 1rem;
      opacity: 0.95;
    }

    .cover {
      margin: 18px auto 22px;
      max-width: 560px;
      padding: 8px;
      border: 2px solid #c9a45b;
      border-radius: 18px;
      background: rgba(255, 244, 210, 0.06);
    }

    .cover img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    .arena-button {
      display: block;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      padding: 15px 18px;
      border: 2px solid #c9a45b;
      border-radius: 16px;
      background: linear-gradient(#d8aa55, #9b6827);
      color: #120b05;
      font-weight: bold;
      font-size: 1.12rem;
      text-decoration: none;
      box-sizing: border-box;
    }

    .arena-button:hover {
      filter: brightness(1.1);
    }

    .secondary-link {
      display: inline-block;
      margin-top: 14px;
      color: #ffe7a6;
      text-decoration: none;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .secondary-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 560px) {
      .splash {
        padding: 18px 14px;
        border-radius: 18px;
      }

      h1 {
        font-size: 2.2rem;
      }

      h2 {
        font-size: 1.1rem;
      }

      p {
        font-size: 0.95rem;
      }

      .arena-button {
        font-size: 1rem;
        padding: 13px 14px;
      }
    }
  </style>
</head>

<body>
  <main class="splash">
    <div class="badge">Duels fantasy</div>

    <h1>Mondes Perdus</h1>
    <h2>Arène de Combat</h2>

    <p>
      Choisis ton combattant, entre dans le cercle, et laisse l’acier décider
      de ce que les bardes oseront raconter.
    </p>

    <div class="cover">
      <img src="images/arena1.png" alt="Arène de combat fantasy" />
    </div>

    <a class="arena-button" href="duel.html">
      Entrer dans l’arène
    </a>

    <a class="secondary-link" href="regles.html">
      Consulter les règles
    </a>
  </main>
</body>
</html>
